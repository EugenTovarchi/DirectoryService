syntax = "proto3";

// По сути как using в C#, вытаскиваем типы из другого .proto файла Google чтобы использовать ниже.
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// C# namespace для сгенерированных request/reply/client/base classes.
option csharp_namespace = "FileService.Contracts.Grpc";

// Версионируем package: если контракт сломается, новый вариант можно вынести в file.v2.
package file.v1;

// Internal API FileService для синхронных запросов от других backend-сервисов.
service FileInternal {
  // Получает полную информацию по одному media asset.
  rpc GetMediaAssetInfo(GetMediaAssetInfoRequest)
      returns (GetMediaAssetInfoReply);

  // Получает краткую информацию по нескольким media assets одним запросом.
  rpc GetMediaAssetsInfo(GetMediaAssetsInfoRequest)
      returns (GetMediaAssetsInfoReply);

  // Проверяет, можно ли использовать media asset как существующий uploaded/ready файл.
  rpc CheckMediaAssetExists(CheckMediaAssetExistsRequest)
      returns (CheckMediaAssetExistsReply);

  // Получаем информацию по video media asset и metadata, если обработка уже их сформировала.
  rpc GetVideoInfo(GetVideoInfoRequest)
      returns (GetVideoInfoReply);
}

message GetMediaAssetInfoRequest {
  // Guid передаем строкой, потому что в protobuf нет стандартного типа Guid.
  string media_asset_id = 1;
}

message GetMediaAssetInfoReply {
  string id = 1;
  string status = 2;
  string asset_type = 3;
  // ISO-8601 string выбран для KISS; позже можно заменить на google.protobuf.Timestamp.
  string created_at = 4;
  string updated_at = 5;
  optional string view_url = 6;
  optional string download_url = 7;
  optional string thumbnail_url = 8;
  optional int64 size = 9;
  optional string file_name = 10;
  optional string content_type = 11;
}

message GetMediaAssetsInfoRequest {
  // Batch-запрос: один gRPC call вместо N отдельных запросов.
  repeated string media_asset_ids = 1;
}

message MediaAssetInfoItem {
  string id = 1;
  string status = 2;
  string asset_type = 3;
  optional string view_url = 4;
  optional string download_url = 5;
  optional string thumbnail_url = 6;
}

message GetMediaAssetsInfoReply {
  repeated MediaAssetInfoItem media_assets = 1;
}

message CheckMediaAssetExistsRequest {
  // Guid передаем строкой, потому что в protobuf нет стандартного типа Guid.
  string media_asset_id = 1;
}

message CheckMediaAssetExistsReply {
  // gRPC transport DTO; adapter мапит его в старый CheckMediaAssetExistResponse.
  bool is_exist = 1;
}

message GetVideoInfoRequest {
    string media_asset_id = 1;
}

message GetVideoInfoReply {
    string id = 1;
    string file_name = 2;
    string content_type = 3;
    string status = 4;

    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;

    int64 size = 7;

    google.protobuf.Duration duration = 8;

    optional int32 width = 9;
    optional int32 height = 10;
    optional bool has_audio = 11;
}
